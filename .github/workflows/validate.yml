name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q workloads scripts tests
      - name: Check shell syntax
        run: |
          for f in scripts/*.sh env/*.sh; do bash -n "$f"; done
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Reevaluate committed historical routing cohorts
        run: |
          python scripts/routing_evaluate.py results/2026-10-12-runpod-2x-rtxpro4500/day2-main > /tmp/routing-primary.txt
          python scripts/routing_followup_evaluate.py sens results/2026-10-12-runpod-2x-l40s/day2-sens > /tmp/routing-sensitivity.txt
          python scripts/routing_followup_evaluate.py supp results/2026-10-12-runpod-2x-l40s/day2-supp > /tmp/routing-capacity.txt
      - name: Published hypothesis verdicts must reproduce exactly
        # Any analysis change that alters a published number or verdict fails here.
        run: |
          diff -u results/2026-10-12-runpod-2x-rtxpro4500/day2-main/hypotheses.txt /tmp/routing-primary.txt
          diff -u results/2026-10-12-runpod-2x-l40s/day2-sens/hypotheses.txt /tmp/routing-sensitivity.txt
          diff -u results/2026-10-12-runpod-2x-l40s/day2-supp/hypotheses.txt /tmp/routing-capacity.txt
      - name: Verify prospective matrix dry run
        run: |
          DRY_RUN=1 STUDY_PHASE=pilot bash scripts/run_load_crossover.sh
          DRY_RUN=1 STUDY_PHASE=main bash scripts/run_load_crossover.sh
