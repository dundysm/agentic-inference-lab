name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q workloads scripts tests
      - name: Check shell syntax
        run: |
          for f in scripts/*.sh env/*.sh; do bash -n "$f"; done
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify prospective matrix dry run
        run: |
          DRY_RUN=1 STUDY_PHASE=pilot bash scripts/run_load_crossover.sh
          DRY_RUN=1 STUDY_PHASE=main bash scripts/run_load_crossover.sh
