<text x="36" y="42" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">Resumed-prefix reuse falls off a cliff</text>
<text x="36" y="64" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#94a3b8">16 synthetic sessions · Qwen3-4B-Instruct-2507 · vLLM · NVIDIA A40</text>
<path d="M93 99V286H1025" stroke="#73839c" stroke-width="1.6" fill="none"/>
<path d="M93 99H1025 M93 192H1025" stroke="#2b3b53" stroke-width="1" stroke-dasharray="4 7"/>
