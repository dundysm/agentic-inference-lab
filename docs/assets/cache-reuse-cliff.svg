<text x="166" y="271" fill="#fdba74">0.5%</text><text x="318" y="271" fill="#fdba74">0.5%</text><text x="470" y="271" fill="#fdba74">0.5%</text><text x="622" y="271" fill="#fdba74">0.5%</text>
