<text x="78" y="197" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#cbd5e1">50%</text>
<text x="78" y="290" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#cbd5e1">0%</text>
<text x="37" y="175" text-anchor="middle" transform="rotate(-90 37 175)" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#94a3b8">Cached token fraction</text>
