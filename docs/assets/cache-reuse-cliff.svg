<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
<title id="title">Observed median resumed cached-token fractions versus KV memory budget</title>
<desc id="desc">The observed fraction is 0.5 percent at 2.5, 3, 4.5 and 6 GiB, and 98.9 percent at 8 GiB in an exploratory single-run budget scan. 10 GiB is 98.9 percent from the main repeated experiment.</desc>
